<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Harness</title>
<style>
  :root { --bg:#0d0f12; --panel:#15181d; --line:#262a31; --text:#e6e6e6; --dim:#6b7280; --mid:#9ca3af; --yellow:#e0b44a; --red:#e5484d; --green:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,monospace; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; }
  header .brand { font-weight:700; letter-spacing:.08em; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border:1px solid var(--line); border-radius:999px; font-size:12px; color:var(--mid); }
  .pill b { color:var(--text); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .live .dot { background:var(--green); box-shadow:0 0 8px var(--green); }
  .stale .dot { background:var(--red); }
  .live b.state { color:var(--green); } .stale b.state { color:var(--red); }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; padding:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; min-width:0; }
  section h2 { margin:0 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600; display:flex; justify-content:space-between; }
  section h2 span { letter-spacing:0; text-transform:none; color:var(--mid); }
  .empty { color:var(--dim); font-style:italic; }
  ul { list-style:none; margin:0; padding:0; } li { padding:3px 0; border-top:1px solid var(--line); } li:first-child { border-top:0; }
  .row { display:flex; gap:10px; justify-content:space-between; align-items:baseline; }
  .k { color:var(--dim); } .y { color:var(--yellow); } .r { color:var(--red); } .g { color:var(--green); } .m { color:var(--mid); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--yellow); }
  .bar.hot i { background:var(--red); }
  .stat { font-size:26px; font-weight:600; line-height:1.1; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
  .tree li { border:0; padding:2px 0; } .tree .child { padding-left:18px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; } td, th { text-align:left; padding:3px 6px 3px 0; border-top:1px solid var(--line); vertical-align:top; } th { color:var(--dim); font-weight:500; border-top:0; }
  .mono-sm { font-size:12px; color:var(--mid); word-break:break-all; }
  @media (max-width:520px) { main { padding:12px; gap:10px; } header { padding:10px 12px; } }
</style>
</head>
<body>
<header id="strip" class="stale">
  <span class="brand">A1 HARNESS</span>
  <span class="pill"><span class="dot"></span><b class="state" id="s-state">CONNECTING</b><span id="s-age"></span></span>
  <span class="pill">repo <b id="s-repo">…</b></span>
  <span class="pill">branch <b id="s-branch">…</b></span>
  <span class="pill">blueprint changed <b id="s-change">…</b></span>
  <span class="pill">CLIs <b id="s-clis">…</b></span>
  <span class="pill">agents running <b id="s-agents">…</b></span>
</header>
<main>
  <section><h2>Now running <span id="run-age"></span></h2><div id="run"></div></section>
  <section><h2>Agent tree <span id="agents-n"></span></h2><div id="agents"></div></section>
  <section><h2>Sandbox &amp; permissions</h2><div id="perms"></div></section>
  <section><h2>Blocked models <span id="usage-age"></span></h2><div id="blocked"></div></section>
  <section><h2>Token spend</h2><div id="tokens"></div></section>
  <section><h2>Subscription windows</h2><div id="windows"></div></section>
  <section><h2>Feature pipeline</h2><div id="pipeline"></div></section>
  <section><h2>Git</h2><div id="git"></div></section>
  <section><h2>Gate results</h2><div id="gates"></div></section>
  <section><h2>Files touched</h2><div id="files"></div></section>
  <section><h2>Hardware</h2><div id="hw"></div></section>
  <section><h2>Recent trace events</h2><div id="events"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const span = (sec) => sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.floor(sec/60)}m` : sec < 86400 ? `${Math.floor(sec/3600)}h` : `${Math.floor(sec/86400)}d`;
const ago = (iso) => { if (!iso) return "—"; const s = Math.round((Date.now() - Date.parse(iso)) / 1000); return Number.isNaN(s) ? "—" : s >= 0 ? `${span(s)} ago` : `in ${span(-s)}`; };
const until = (iso) => { if (!iso) return ""; const s = Math.round((Date.parse(iso) - Date.now()) / 1000); return Number.isNaN(s) ? "" : s > 0 ? `resets in ${span(s)}` : `reset ${span(-s)} ago`; };
const empty = (t) => `<div class="empty">${esc(t)}</div>`;
const STALE_AFTER_MS = 6000;
let lastOk = 0;

function render(st) {
  // live strip
  $("s-repo").textContent = st.repo.path.replace(/^\/Users\/[^/]+/, "~");
  $("s-branch").textContent = st.repo.branch || (st.repo.gitRepo ? "?" : "no git");
  $("s-change").textContent = st.repo.blueprintPresent ? ago(st.repo.lastChange) : "no blueprint/";
  $("s-clis").textContent = st.clis.filter(c => c.found).map(c => c.cmd).join(" ") || "none";
  const headless = st.agents.filter(a => a.headless);
  $("s-agents").textContent = `${headless.length} headless · ${st.agents.length - headless.length} interactive`;

  // now running
  const r = st.run;
  $("run-age").textContent = r ? `updated ${ago(r.updatedAt)}` : "";
  $("run").innerHTML = !r ? empty("no run.json yet — nothing has run through the loop") : r._invalid ? `<span class="r">run.json is malformed</span>` : `
    <div class="row"><span class="stat">/${esc(r.command)}</span><span class="${r.status==="blocked"?"r":r.status==="running"?"y":"g"}">${esc(r.status)}</span></div>
    <div class="m" style="margin-top:6px">${esc(r.summary||"")}</div>
    ${r.detail ? `<div class="k">${esc(r.detail)}</div>` : ""}
    <div class="grid2" style="margin-top:8px">
      <div><span class="k">boundary</span> ${esc(r.boundary||"—")}</div>
      <div><span class="k">started</span> ${ago(r.startedAt)}</div>
      ${r.feature ? `<div><span class="k">feature</span> ${esc(r.feature.id)} ${esc(r.feature.title)}</div>` : ""}
      ${r.progress ? `<div><span class="k">progress</span> ${esc(r.progress.current)}/${esc(r.progress.total)} ${esc(r.progress.label)}</div>` : ""}
      ${r.resumeCommand ? `<div><span class="k">resume</span> ${esc(r.resumeCommand)}</div>` : ""}
    </div>`;

  // agent tree: parents (interactive) with their headless children by ppid
  $("agents-n").textContent = `${st.agents.length} process${st.agents.length===1?"":"es"}`;
  if (!st.agents.length) $("agents").innerHTML = empty("no claude / codex / agy / ollama processes running");
  else {
    const byPid = new Map(st.agents.map(a => [a.pid, a]));
    const roots = st.agents.filter(a => !byPid.has(a.ppid));
    const node = (a, depth) => `<li class="${depth?"child":""}"><span class="${a.headless?"y":"m"}">${a.headless?"▸":"●"}</span> <b>${esc(a.cli)}</b> <span class="k">pid ${a.pid}</span> ${a.model?`<span class="y">${esc(a.model)}</span>`:""} <span class="k">${a.headless?"headless":"interactive"}</span><div class="mono-sm">${esc(a.args)}</div></li>` +
      st.agents.filter(c => c.ppid === a.pid).map(c => node(c, depth + 1)).join("");
    $("agents").innerHTML = `<ul class="tree">${roots.map(a => node(a, 0)).join("")}</ul>`;
  }

  // sandbox & permissions (from trace sessions that are still open)
  const open = st.trace.available ? st.trace.openSessions : [];
  $("perms").innerHTML = !st.trace.available ? empty(st.trace.reason) : !open.length ? empty("no open agent sessions in trace.db") :
    `<table><tr><th>session</th><th>cli / model</th><th>sandbox</th><th>mode</th><th>tools</th><th>write scope</th></tr>${open.map(s => `<tr>
      <td>${esc(s.command||"—")}<div class="mono-sm">${esc(s.session_id)}</div></td><td>${esc(s.cli)}<div class="mono-sm">${esc(s.model||"")}</div></td>
      <td class="${s.sandbox?"g":"r"}">${s.sandbox?"on":"off"}</td><td>${esc(s.permission_mode||"—")}</td>
      <td class="mono-sm">allow ${esc(s.allowed_tools||"[]")}<br>deny ${esc(s.disallowed_tools||"[]")}</td><td class="mono-sm">${esc(s.allowed_paths||"—")}</td></tr>`).join("")}</table>`;

  // usage: blocked + windows
  const u = st.usage;
  $("usage-age").textContent = u ? `polled ${ago(u.polledAt)}` : "";
  if (!u) { $("blocked").innerHTML = empty("no usage.json yet — the usage poller is not running"); $("windows").innerHTML = empty("no usage.json yet"); }
  else if (u._invalid) { $("blocked").innerHTML = `<span class="r">usage.json is malformed</span>`; $("windows").innerHTML = ""; }
  else {
    const groups = Object.entries(u.groups || {});
    const blocked = groups.filter(([, g]) => g.blocked);
    $("blocked").innerHTML = !blocked.length ? `<span class="g">nothing blocked</span> <span class="k">threshold ${esc(u.thresholdPercent)}%</span>` :
      `<ul>${blocked.map(([k, g]) => `<li><span class="r">■</span> <b>${esc(g.label||k)}</b> <span class="k">${esc(g.reason||"")}</span><div class="mono-sm">${(g.models||[]).map(esc).join(", ")}</div></li>`).join("")}</ul>`;
    const bar = (w, name) => !w ? `<div class="k">${name}: no limit</div>` : `<div class="row"><span class="k">${name}</span><span>${esc(w.usedPercent)}% <span class="k">${until(w.resetsAt)}</span></span></div><div class="bar ${w.usedPercent>=u.thresholdPercent?"hot":""}"><i style="width:${Math.min(100,w.usedPercent||0)}%"></i></div>`;
    $("windows").innerHTML = `<ul>${groups.map(([k, g]) => `<li><b>${esc(g.label||k)}</b>${bar(g.fiveHour,"5-hour")}${bar(g.weekly,"weekly")}</li>`).join("")}</ul>`;
  }

  // tokens
  const t = st.trace;
  $("tokens").innerHTML = !t.available ? empty(t.reason) : !t.tokens.length ? empty("no sessions traced yet") :
    `<table><tr><th>command</th><th>cli / model</th><th>in</th><th>out</th></tr>${t.tokens.map(x => `<tr><td>/${esc(x.command||"—")}</td><td>${esc(x.cli||"")}<div class="mono-sm">${esc(x.model||"")}</div></td><td class="y">${x.tokens_in.toLocaleString()}</td><td class="y">${x.tokens_out.toLocaleString()}</td></tr>`).join("")}</table>`;

  // pipeline
  const p = st.pipeline, bp = p.buildPlan;
  $("pipeline").innerHTML = `
    <div class="row"><span><span class="stat">${bp.done}</span> <span class="k">/ ${bp.total} features done</span></span><span class="${p.findings.p0||p.findings.p1?"r":"g"}">P0 ${p.findings.p0} · P1 ${p.findings.p1}</span></div>
    <div class="bar"><i style="width:${bp.total?Math.round(100*bp.done/bp.total):0}%"></i></div>
    <div style="margin-top:8px"><span class="k">current feature</span> ${p.currentFeature.inProgress ? `<b>${esc(p.currentFeature.title||"(untitled)")}</b> <span class="y">${esc(p.currentFeature.status||"")}</span>` : `<span class="k">none in progress</span>`}</div>
    ${bp.items.length ? `<ul style="margin-top:8px">${bp.items.map(i => `<li><span class="${i.done?"g":"k"}">${i.done?"☑":"☐"}</span> ${i.id?`<span class="k">${esc(i.id)}.</span> `:""}${esc(i.title)}</li>`).join("")}</ul>` : `<div class="empty" style="margin-top:6px">build-plan.md has no checklist yet — run /plan</div>`}`;

  // git
  const g = st.git;
  $("git").innerHTML = !g ? empty("not a git repository") : `
    <div class="grid2"><div><span class="k">branch</span> <b>${esc(st.repo.branch)}</b></div><div><span class="k">uncommitted</span> <span class="${g.dirtyFiles?"y":"g"}">${g.dirtyFiles} file${g.dirtyFiles===1?"":"s"}</span></div></div>
    <div style="margin-top:8px"><span class="k">worktrees</span><ul>${g.worktrees.map(w => `<li><b>${esc(w.branch||"(detached)")}</b> <span class="mono-sm">${esc(w.path)}</span></li>`).join("")}</ul></div>
    <div style="margin-top:8px"><span class="k">branches</span> <span class="m">${g.branches.map(b => esc(b.name)).join(" · ")}</span></div>
    ${g.tags.length ? `<div style="margin-top:8px"><span class="k">tags</span> <span class="m">${g.tags.map(esc).join(" · ")}</span></div>` : ""}
    <div style="margin-top:8px"><span class="k">commits</span><ul>${g.commits.map(c => `<li><span class="y">${esc(c.hash)}</span> ${esc(c.subject)} <span class="k">${ago(c.date)}</span></li>`).join("")}</ul></div>`;

  // gates
  $("gates").innerHTML = !t.available ? empty(t.reason) : !t.gates.length ? empty("no gate results yet") :
    `<ul>${t.gates.map(x => `<li><span class="${x.passed?"g":"r"}">${x.passed?"PASS":"FAIL"}</span> <b>${esc(x.gate)}</b> <span class="k">/${esc(x.command||"—")} · ${ago(x.ts)}</span>${x.evidence?`<div class="mono-sm">${esc(x.evidence)}</div>`:""}</li>`).join("")}</ul>`;

  // files touched
  $("files").innerHTML = !t.available ? empty(t.reason) : !t.files.length ? empty("no file records yet") :
    `<table><tr><th>path</th><th>claimed</th><th>actual</th><th>scope</th></tr>${t.files.map(f => `<tr><td class="mono-sm">${esc(f.path)}</td><td>${f.claimed?"✓":""}</td><td>${f.actual?"✓":""}</td><td class="${f.reverted?"r":f.in_scope===0?"r":f.in_scope===1?"g":"k"}">${f.reverted?"reverted":f.in_scope===0?"out":f.in_scope===1?"in":"—"}</td></tr>`).join("")}</table>`;

  // hardware
  const h = st.hardware, memPct = Math.round(100 * (1 - h.freeMemGb / h.totalMemGb));
  $("hw").innerHTML = `
    <div class="grid2"><div><span class="k">cpu load (1m)</span> <b>${h.load1}</b> <span class="k">/ ${h.cpus} cores</span></div><div><span class="k">memory used</span> <b>${memPct}%</b> <span class="k">${h.freeMemGb} GB free of ${h.totalMemGb}</span></div></div>
    <div class="bar ${memPct>85?"hot":""}"><i style="width:${memPct}%"></i></div>
    ${h.hardwareJson ? `<div class="mono-sm" style="margin-top:6px">${esc(JSON.stringify(h.hardwareJson))}</div>` : `<div class="k" style="margin-top:6px">ollama gate: no hardware.json yet</div>`}`;

  // events
  $("events").innerHTML = !t.available ? empty(t.reason) : !t.events.length ? empty("no events yet") :
    `<ul>${t.events.map(e => `<li><span class="k">${ago(e.ts)}</span> <b>${esc(e.kind)}</b> ${esc(e.name||"")} <span class="mono-sm">${esc(e.session_id)}</span>${e.tokens_in||e.tokens_out?` <span class="y">${e.tokens_in||0}/${e.tokens_out||0}</span>`:""}</li>`).join("")}</ul>`;
}

function setLive(ok) {
  const strip = $("strip");
  strip.className = ok ? "live" : "stale";
  $("s-state").textContent = ok ? "LIVE" : "STALE";
  $("s-age").textContent = lastOk ? ` · data ${ago(new Date(lastOk).toISOString())}` : "";
}

async function poll() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const st = await res.json();
    lastOk = Date.now();
    render(st);
    setLive(true);
  } catch { setLive(false); }
}
poll();
setInterval(poll, 2000);
setInterval(() => setLive(Date.now() - lastOk < STALE_AFTER_MS), 1000);
</script>
</body>
</html>
