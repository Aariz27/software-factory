<!--
  error-flow template
  ====================
  This file is filled in by the error-flow skill, not hand-edited per project.

  What the skill replaces:
    - __ARGUMENT__          -> the raw text passed to /error-flow (used in <title> and the heading)
    - __SOURCE_PATHS__      -> the resolved file path(s) the diagram was drawn from
    - the BRANCHES marker comment     -> replaced with one <g class="branch up|down [unhandled]"> per
                               failure found on the happy path, in left-to-right step order.

  How a branch is built (copy this shape per failure):

    <g class="branch down" transform="translate(X,0)">
      <polyline class="crack" points="0,200 15,230 -10,255 20,285" />
      <text class="value" x="20" y="305">FAILURE_VALUE</text>
      <text class="caption" x="20" y="323">plain words caption</text>
    </g>

    For an "up" branch, mirror the y offsets above the line (170,145,115 instead of
    230,255,285) and put the <text> elements above the line (y="95" and y="77" instead
    of below), so the value sits closest to the line and the caption is outermost.

    - X is this branch's horizontal position along the line (evenly spaced across the
      available width, in left-to-right order of the steps in the code).
    - Alternate class="branch down" / class="branch up" for consecutive branches so
      labels never collide.
    - Add class="unhandled" (e.g. class="branch down unhandled") when the code has no
      handling for that failure category. Only the .crack and .value colors change for
      unhandled branches (dimmer red) -- the caption color stays the same grey, and its
      text should make clear the failure is unhandled.
    - The happy-path <line> should span the full drawn width; if there are many branches
      and they would get too cramped on one row, wrap the path into multiple stacked rows
      (repeat the <line> + its branches at a lower y, each row is its own horizontal
      segment) rather than shrinking text -- the page scrolls vertically, never
      horizontally.

  The BRANCHES marker comment below marks where the skill inserts its <g> elements.
  The five <g> blocks currently there are the worked example from SKILL.md and must be
  removed (all of them, not just the first) when this template is filled for a real run.
-->
